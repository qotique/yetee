name: Build

on:
  push:
    branches: [main, packaging]
    tags: ['*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv && uv sync --group dev
      - name: Run tests
        run: uv run python -m pytest tests/ -v

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flet flet-desktop lxml keyring asyncssh aioftp
      - name: Download client and Build Linux
        run: |
          VER=$(python -c "import flet_desktop.version as v; print(v.version)")
          DISTRO=$(python -c "import flet_desktop; print(flet_desktop.__get_linux_distro_id())")
          ARTIFACT="flet-linux-${DISTRO}-light-amd64.tar.gz"
          curl -fL -o "$ARTIFACT" \
            "https://github.com/flet-dev/flet/releases/download/v${VER}/${ARTIFACT}"
          pyinstaller --clean --onefile --name types_editor_linux \
            --collect-all flet \
            --collect-all flet_desktop \
            --collect-all lxml \
            --collect-all keyring \
            --collect-all asyncssh \
            --collect-all aioftp \
            --add-data "src/main.py:." \
            --add-data "src/file_display.py:." \
            --add-data "src/assets:assets" \
            --add-data "flet-linux-${DISTRO}-light-amd64.tar.gz:flet_desktop/app" \
            src/main.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: types_editor_linux
          path: dist/types_editor_linux

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flet flet-desktop lxml keyring asyncssh aioftp
      - name: Download client and Build Windows
        shell: pwsh
        run: |
          $VER = python -c "import flet_desktop.version as v; print(v.version)"
          Invoke-WebRequest -Uri "https://github.com/flet-dev/flet/releases/download/v${VER}/flet-windows.zip" -OutFile flet-windows.zip
          pyinstaller --clean --onefile --name types_editor_windows.exe `
            --collect-all flet `
            --collect-all flet_desktop `
            --collect-all lxml `
            --collect-all keyring `
            --collect-all asyncssh `
            --collect-all aioftp `
            --add-data "src/main.py;." `
            --add-data "src/file_display.py;." `
            --add-data "src/assets;assets" `
            --add-data "flet-windows.zip;flet_desktop/app" `
            src/main.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: types_editor_windows
          path: dist/types_editor_windows.exe

  release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: types_editor_linux
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: types_editor_windows
          path: dist/
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --github-repo ${{ github.repository }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/types_editor_linux
            dist/types_editor_windows.exe
          body: ${{ steps.git-cliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}