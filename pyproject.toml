[project]
name = "types-editor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.1",
    "lxml>=5.0.0"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.1",
    "flet-desktop>=0.86.1",
    "flet-web>=0.86.1",
    "flet[test]>=0.86.1",
    "pyinstaller",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "types-editor"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
