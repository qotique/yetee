[project]
name = "types-editor"
version = "0.6.2"
description = "DayZ economy type files editor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
license = "MIT"

dependencies = [
    "flet>=0.86.1",
    "lxml>=5.0.0",
    "asyncssh>=2.15.0",
    "aioftp>=0.21.4",
    "keyring>=24.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flet-cli>=0.86.1",
    "flet-desktop>=0.86.1",
    "flet-web>=0.86.1",
    "flet[test]>=0.86.1",
    "pyinstaller",
    "mypy>=1.8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_calls = false
allow_untyped_defs = false
disallow_any_unimported = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["flet", "lxml", "lxml.etree", "asyncssh", "aioftp", "keyring"]
ignore_missing_imports = true

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "types-editor"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
